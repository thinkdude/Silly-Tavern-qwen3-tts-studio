name: Release

# Pushing a tag like v1.0.0 tests the code, builds Qwen3-TTS-Studio-1.0.0.zip and
# publishes the GitHub release with it. Running it by hand (Actions > Release > Run
# workflow) builds the ZIP and keeps it as a workflow artifact, so you can try it
# first; tick "Publish" to also tag main as v<VERSION> and publish the release,
# without pushing a tag yourself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: tag this commit as v<VERSION> and publish the release (main only)"
        type: boolean
        default: false

jobs:
  # Fails in seconds, before the long tests, when the release can't be published.
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION and isn't released yet
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION (${version}). Tag ${tag}, or change VERSION first."
            exit 1
          fi
          if [ "${PUBLISH}" = true ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Publish only from main (this run is on ${GITHUB_REF_NAME})."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "::error::${tag} already exists. Put a new version in VERSION and CHANGELOG.md first."
              exit 1
            fi
          fi
          if { [ "${GITHUB_EVENT_NAME}" = push ] || [ "${PUBLISH}" = true ]; } \
              && gh release view "${tag}" > /dev/null 2>&1; then
            echo "::error::Release ${tag} is already published."
            exit 1
          fi

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml

  installer:
    needs: check
    uses: ./.github/workflows/installer.yml

  release:
    needs: [check, tests, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the ZIP
        run: python scripts/build_release.py --out dist --notes dist/notes.md

      - name: Keep the ZIP as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qwen3-TTS-Studio
          path: dist/

      # With "Publish" ticked, gh creates the tag on this commit (a tag made with the
      # workflow's token doesn't start this workflow again).
      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          target=()
          if [ "${GITHUB_EVENT_NAME}" != push ]; then target=(--target "${GITHUB_SHA}"); fi
          gh release create "${TAG}" dist/*.zip "${target[@]}" \
            --title "Qwen3-TTS Studio ${TAG#v}" \
            --notes-file dist/notes.md
