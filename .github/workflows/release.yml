name: Release

# Pushing a tag like v1.0.0 tests the code, builds Qwen3-TTS-Studio-1.0.0.zip and
# publishes the GitHub release with it. Running it by hand only builds the ZIP and
# keeps it as a workflow artifact, so you can try it before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  installer:
    uses: ./.github/workflows/installer.yml

  release:
    needs: [tests, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches VERSION
        if: github.event_name == 'push'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION (${version}). Tag v${version}, or change VERSION first."
            exit 1
          fi

      - name: Build the ZIP
        run: python scripts/build_release.py --out dist --notes dist/notes.md

      - name: Keep the ZIP as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qwen3-TTS-Studio
          path: dist/

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Qwen3-TTS Studio ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md
